services:
  - type: web
    name: aiba-api
    runtime: docker
    dockerfilePath: ./infrastructure/Dockerfile.api
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v25.0
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
  - type: web
    name: aiba-web
    runtime: static
    buildCommand: npm install && npm run build -w apps/web
    staticPublishPath: ./apps/web/out
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://aiba-api.onrender.com
